<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#14162E">
<title>New Year's Eve Kitchen</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/skai.css">
</head>
<body>
<div id="app">
  <!-- 3D kitchen -->
  <canvas id="gl"></canvas>
  <div id="vignette"></div>
  <div id="dim"></div>

  <!-- HUD (shown during play) -->
  <div id="hud" class="hide">
    <div id="rail"><span class="lbl">ORDERS</span><div id="tickets"></div></div>
  </div>
  <div id="barSign" class="hide"><span class="k">TONIGHT'S BAR</span><span class="v"></span></div>
  <div id="wall" class="hide"><div class="h">REVIEW WALL</div><div id="reviews"></div></div>
  <div id="riders" class="hide"></div>
  <div id="zones" class="hide"></div>

  <!-- stage screens -->
  <div id="screen"></div>
  <!-- character voice notes -->
  <div id="talk" class="hide"></div>
  <!-- free-floating effects -->
  <div id="fx"></div>

  <!-- SKAI Entrepreneur chrome (Figma: SKAI-final / Entrepreneur) -->
  <div id="skai">
    <button id="exitTab" aria-label="Exit the mission"><img class="eb" src="assets/skai/exit_brand.svg" alt=""><img class="lm" src="assets/skai/logo_mark.svg" alt=""><img class="lt" src="assets/skai/logo_text.svg" alt=""></button>
    <button id="soundBtn" class="note" aria-label="Sound"><span class="rot"><img src="assets/skai/sound_note.svg" alt=""></span><img class="ico" src="assets/skai/sound_icon.svg" alt=""></button>
    <button id="howBtn" class="note" aria-label="What do we do?"><span class="rot"><img src="assets/skai/info_note.svg" alt=""></span><b class="i">i</b></button>
    <div id="clock" class="timer"><img class="clip" src="assets/skai/timer_clip.svg" alt=""><div class="t">9:00<small>PM</small></div><div class="cd">3:00:00 to midnight</div></div>
    <div id="soundMenu" class="hide"><img class="bg" src="assets/skai/sound_menu.svg" alt="">
      <button id="replayBtn"><img class="ri" src="assets/skai/icon_replay.svg" alt=""><span>Replay<br>Narration</span></button>
      <button id="muteBtn"><span class="mi"><img class="mb" src="assets/skai/icon_mute_b.svg" alt=""><img class="ma" src="assets/skai/icon_mute_a.svg" alt=""></span><span class="lbl">Mute All<br>Sounds</span></button>
    </div>
    <div id="progress" aria-label="Mission progress"><img class="bg" src="assets/skai/rail_bg.svg" alt=""><div class="n">1/11</div><div class="segs"></div></div>
    <button id="hintBtn" class="note big away" aria-label="Show me a hint"><span class="rot"><img src="assets/skai/hint_note.svg" alt=""></span><img class="b1" src="assets/skai/hint_bulb_a.svg" alt=""><img class="b2" src="assets/skai/hint_bulb_b.svg" alt=""></button>
    <button id="menuBtn" aria-label="Facilitator menu">☰</button>
  </div>
  <div id="howShade" class="hide"></div>
  <div id="howCard" class="glass hide"></div>
  <div id="exitAsk" class="hide"></div>
  <div id="menu" class="hide"></div>
  <div id="loader"><div class="ring"></div><div class="txt">Warming up the kitchen…</div></div>
</div>

<script src="js/vendor/gsap.min.js"></script>
<script type="importmap">
{ "imports": { "three": "./js/vendor/three.module.min.js" } }
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
